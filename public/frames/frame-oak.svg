<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <!-- Warm Oak Wood Gradient -->
    <linearGradient id="oak-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c68c53" />
      <stop offset="25%" stop-color="#e0a96d" />
      <stop offset="50%" stop-color="#bd7f47" />
      <stop offset="75%" stop-color="#e0a96d" />
      <stop offset="100%" stop-color="#995c26" />
    </linearGradient>

    <filter id="oak-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="-8" dy="10" stdDeviation="9" flood-color="#2b1a09" flood-opacity="0.3" />
    </filter>
  </defs>

  <g transform="rotate(4 200 240)" filter="url(#oak-shadow)">
    <!-- Main Oak Box Outer Frame -->
    <path fill-rule="evenodd" fill="url(#oak-grad)" d="M 45,35 h 310 v 390 h -310 z
             M 67,57 h 266 v 346 h -266 z" />

    <!-- Outer White Mat -->
    <path fill-rule="evenodd" fill="#ffffff" d="M 67,57 h 266 v 346 h -266 z
             M 103,93 h 194 v 274 h -194 z" />

    <!-- Dark Inner Accent Mat (Double Matting) -->
    <path fill-rule="evenodd" fill="#2c3531" d="M 103,93 h 194 v 274 h -194 z
             M 107,97 h 186 v 266 h -186 z" />

    <!-- Primary Top Mat Cutout -->
    <path fill-rule="evenodd" fill="#faf8f5" d="M 107,97 h 186 v 266 h -186 z
             M 125,115 h 150 v 230 h -150 z" />

    <!-- Inner Opening Shadow -->
    <rect x="125" y="115" width="150" height="230" fill="none" stroke="#000000" stroke-width="3" opacity="0.2" />
  </g>
</svg>
