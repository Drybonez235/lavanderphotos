<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <!-- Wood Grain Texture Pattern -->
    <linearGradient id="wood-base" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d1a0e" />
      <stop offset="50%" stop-color="#422817" />
      <stop offset="100%" stop-color="#1f1209" />
    </linearGradient>

    <pattern id="wood-grain" width="400" height="40" patternUnits="userSpaceOnUse">
      <line x1="0" y1="5" x2="400" y2="7" stroke="#150a04" stroke-width="1.5" opacity="0.4" />
      <line x1="0" y1="15" x2="400" y2="13" stroke="#5a3821" stroke-width="1" opacity="0.3" />
      <line x1="0" y1="28" x2="400" y2="29" stroke="#100703" stroke-width="2" opacity="0.5" />
      <line x1="0" y1="35" x2="400" y2="34" stroke="#4a2d1a" stroke-width="0.8" opacity="0.4" />
    </pattern>

    <filter id="wood-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="-6" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <g transform="rotate(3 200 240)" filter="url(#wood-shadow)">
    <!-- Main Frame Wood Body -->
    <path fill-rule="evenodd" fill="url(#wood-base)" d="M 40,30 h 320 v 400 h -320 z
             M 80,70 h 240 v 320 h -240 z" />
    <path fill-rule="evenodd" fill="url(#wood-grain)" d="M 40,30 h 320 v 400 h -320 z
             M 80,70 h 240 v 320 h -240 z" />

    <!-- Recessed Cut Border -->
    <path fill-rule="evenodd" fill="#170c06" d="M 80,70 h 240 v 320 h -240 z
             M 85,75 h 230 v 310 h -230 z" />

    <!-- White Matboard -->
    <path fill-rule="evenodd" fill="#f4f1ea" d="M 85,75 h 230 v 310 h -230 z
             M 117,107 h 166 v 246 h -166 z" />

    <!-- Highlight Edge -->
    <rect x="41" y="31" width="318" height="398" rx="2" fill="none" stroke="#6e4528" stroke-width="1" opacity="0.5" />

    <!-- Inner Cutout Drop Shadow -->
    <rect x="117" y="107" width="166" height="246" fill="none" stroke="#000000" stroke-width="4" opacity="0.2" />
  </g>
</svg>
